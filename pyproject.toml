[project]
name = "techstudio"
version = "0.1.0"
description = "TechStudio: тема -> сценарий -> ревью -> визуалы -> озвучка -> длинное видео + шортсы -> ревью -> публикация -> аналитика"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    "Pygments>=2.18",
    "aiogram>=3.10",
    "anthropic>=0.40",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "pytest-asyncio>=0.23"]
asr = ["faster-whisper>=1.0"]
mac = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
studio = "techstudio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techstudio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S603", "S602", "S604"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603"]
# subprocess разрешён только в обёртках: ffmpeg, песочница, piper, mermaid-cli, doctor
"src/techstudio/core/ffmpeg.py" = ["S603"]
"src/techstudio/sandbox/docker.py" = ["S603"]
"src/techstudio/voice/piper.py" = ["S603"]
"src/techstudio/render/diagram.py" = ["S603"]
"src/techstudio/doctor.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["slow: uses real ffmpeg rendering"]
